<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - StudyGuard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>📚 StudyGuard</h1>

        <h2>Welcome Back!</h2>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <p class="message">{{ message }}</p>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

    </div>

</body>

</html>
