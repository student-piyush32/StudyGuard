<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Group - StudyGuard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="form-container">

    <h1>👥 Create Study Group</h1>

    <p>Create a group and invite your friends.</p>

    <form method="POST">

        <input
            type="text"
            name="group_name"
            placeholder="Enter group name"
            required
        >

        <button type="submit">
            Create Group
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>

</div>

</body>

</html>
